name: Deploy apps in vercel Platform

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Types
        run: pnpm check-types
      
      - name: Build
        run: pnpm build